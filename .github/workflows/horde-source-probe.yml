name: Alternate no-key cinematic portrait source probe
on:
  push:
    branches: [fix/reference-visual-characters-v9]
    paths: [.github/workflows/horde-source-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Test real anonymous AI Horde portrait
        run: |
          python - <<'PY'
          import urllib.request,json,time
          base="https://stablehorde.net/api/v2"
          data={"prompt":"Cinematic beautiful professional fictional AI agent woman wavy dark hair in dark tailored blazer luxury academic office, editorial fine art portrait, full head and shoulders, tungsten and navy lights ### text, writing, watermark, robot","params":{"width":512,"height":640,"steps":22,"n":1},"nsfw":False,"censor_nsfw":True}
          req=urllib.request.Request(base+"/generate/async",data=json.dumps(data).encode(),headers={"Content-Type":"application/json","apikey":"0000000000","Client-Agent":"WorkforceOS:1.0:Noetfield"},method="POST")
          with urllib.request.urlopen(req,timeout=30) as res:
              item=json.load(res)
          print("HORDE_SUBMISSION",item,flush=True)
          job=item["id"]
          for i in range(30):
              time.sleep(10)
              with urllib.request.urlopen(base+"/generate/check/"+job,timeout=30) as res:
                  check=json.load(res)
              print("HORDE_CHECK",i,check,flush=True)
              if check.get("done"):break
          with urllib.request.urlopen(base+"/generate/status/"+job,timeout=30) as res:
              status=json.load(res)
          print("HORDE_RESULT",status.get("done"),str(status.get("generations",[]))[:800],flush=True)
          assert status.get("done") and status.get("generations"),"HORDE_NOT_COMPLETE"
          PY

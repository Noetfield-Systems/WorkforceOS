name: Character image source probe
on:
  push:
    branches: [fix/reference-visual-characters-v9]
    paths: [.github/workflows/character-source-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test source image transfer at full size
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          u="https://media.canva.com/v2/image-resize/format:PNG/height:125/quality:100/uri:ifs%3A%2F%2FM%2Fab7f0627-c42b-454c-b63a-571a1903a5c1/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAFpgCobqQn_p0oXENtpSFP5wcgDxO7K_zcQbuPW_p-s0&exp=1794995777&osig=AAAAAAAAAAAAAAAAAAAAAFpVNET9pJaW-zAFH1L8_rqVC2pfu6Wv8XQF2wR5MTWU&signer=media-rpc&token=AAIAAU0AJGFiN2YwNjI3LWM0MmItNDU0Yy1iNjNhLTU3MWExOTAzYTVjMQAAAAABoe4V7ehdt5RxO4UF484jjW4sKsdHWY18YgYH5DPNNGesNpjBFA&x-canva-quality=thumbnail"
          for label,url in [('source',u),('larger',u.replace('height:125','height:800').replace('width:200','width:640'))]:
           try:
            r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20)
            b=r.read(10000000)
            print(label, r.status,r.headers.get('content-type'),len(b),b[:10].hex())
           except Exception as e:print(label,'ERROR',str(e)[:180])
          PY

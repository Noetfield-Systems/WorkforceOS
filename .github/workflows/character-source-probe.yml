name: Character image source probe
on:
  push:
    branches: [fix/reference-visual-characters-v9]
    paths: [.github/workflows/character-source-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe cinematic image generation endpoint
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse
          prompt="Original fictional AI agent character, cinematic chest-up portrait of thoughtful thirty year old woman with wavy brunette hair wearing a tailored blazer, warm historical library and glass office background, dark navy and amber, premium editorial photography, no text no robot, full head visible"
          url="https://image.pollinations.ai/prompt/"+urllib.parse.quote(prompt,safe="")+"?width=384&height=512&seed=1732&nologo=true&model=flux"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          try:
              with urllib.request.urlopen(req,timeout=95) as response:
                  content=response.read(3000000)
                  print("STATUS",response.status,"TYPE",response.headers.get("content-type"),"BYTES",len(content),"HEAD",content[:20].hex())
                  assert response.headers.get("content-type","").startswith("image/"),"NOT_IMAGE"
                  assert len(content)>20000,"IMAGE_TOO_SMALL"
          except Exception as e:
              print("SOURCE_UNAVAILABLE",type(e).__name__,str(e)[:300]);raise
          PY

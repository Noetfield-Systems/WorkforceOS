name: Live synthetic customer and real-business challenge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/live-customer-qa.yml']
  workflow_dispatch:
  schedule:
    # Verify one real backend synthetic journey every six hours, no fake customer conversion.
    - cron: '41 2,8,14,20 * * *'
jobs:
  live-customer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public live journey (synthetic tester, real backend and model)
        run: python qa/live_customer_journey.py
      - name: Preserve verified QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-synthetic-customer-results
          path: artifacts/live-qa.json

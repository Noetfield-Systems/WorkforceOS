name: AI Horde cinematic models probe
on:
  push:
    branches: [fix/reference-visual-characters-v9]
    paths: [.github/workflows/character-model-probe.yml]
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - name: Select high-quality image synthesis engines
        run: |
          python - <<'PY'
          import urllib.request,json
          u='https://stablehorde.net/api/v2/status/models'
          with urllib.request.urlopen(u,timeout=30) as r:
              models=json.load(r)
          print('MODEL_COUNT',len(models))
          for m in models:
              n=m.get('name','')
              if any(w in n.lower() for w in ['xl','flux','dreamshaper','realistic','juggernaut','photo','realvis','cinematic']):
                  print('MODEL',n,'COUNT',m.get('count'),'QUEUE',m.get('queued'))
          PY
